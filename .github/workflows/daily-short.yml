name: Daily Short

on:
  schedule:
    # Once a day at 15:23 UTC (about 9-10am in Texas). Videos upload as private
    # or scheduled depending on UPLOAD_MODE, so the run time isn't the publish time.
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (e.g. dogs, phone-tips) or your own idea (e.g. how often to mow Bermuda). Blank = automatic"
        required: false
        default: ""
      languages:
        description: "Which versions to make"
        required: false
        default: "both"
        type: choice
        options: ["both", "english", "spanish"]
      reuse_run:
        description: "Redo from run # (reuse that run's script, e.g. 7). Blank = write a new script"
        required: false
        default: ""
      upload:
        description: "Upload mode for this run"
        required: false
        default: ""
        type: choice
        options: ["", "none", "private", "scheduled", "public"]

permissions:
  contents: write
  actions: read  # to fetch an earlier run's script from its artifact

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
      FYA_LANGUAGES: ${{ (inputs.languages == 'english' && 'en') || (inputs.languages == 'spanish' && 'es') || (inputs.languages == 'both' && 'en,es') || vars.FYA_LANGUAGES || 'en,es' }}
      FYA_CHANNEL_NAME: ${{ vars.FYA_CHANNEL_NAME }}
      FYA_CHANNEL_NAME_ES: ${{ vars.FYA_CHANNEL_NAME_ES }}
      FYA_MODEL: ${{ vars.FYA_MODEL }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TTS_VOICE_ES: ${{ vars.TTS_VOICE_ES }}
      UPLOAD_MODE: ${{ inputs.upload || vars.UPLOAD_MODE || 'none' }}
      PUBLISH_HOUR_UTC: ${{ vars.PUBLISH_HOUR_UTC }}
      PUBLISH_HOUR_UTC_ES: ${{ vars.PUBLISH_HOUR_UTC_ES }}
      YT_SYNTHETIC_MEDIA: ${{ vars.YT_SYNTHETIC_MEDIA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter

      - run: pip install -r requirements.txt

      - name: Fetch the earlier script
        if: inputs.reuse_run != ''
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$(echo "$REUSE_RUN" | tr -d ' #')"
          case "$N" in ''|*[!0-9]*) echo "::error::'Redo from run #' must be a run number like 7"; exit 1;; esac
          if [ -f "data/scripts/run-$N.json" ]; then
            echo "Using data/scripts/run-$N.json"; exit 0
          fi
          # Older runs: take script.json from that run's artifact (kept 14 days).
          ID="$(gh run list --workflow daily-short.yml --limit 300 --json number,databaseId \
                --jq ".[] | select(.number == $N) | .databaseId")"
          if [ -z "$ID" ]; then echo "::error::Couldn't find run #$N of this workflow"; exit 1; fi
          gh run download "$ID" --name "short-$N" --dir "$RUNNER_TEMP/prev" || {
            echo "::error::Run #$N has no downloadable files (older than 14 days?)"; exit 1; }
          SCRIPT="$(find "$RUNNER_TEMP/prev" -name script.json | head -1)"
          if [ -z "$SCRIPT" ]; then echo "::error::Run #$N didn't save a script"; exit 1; fi
          mkdir -p data/scripts && cp "$SCRIPT" "data/scripts/run-$N.json"
          echo "Fetched the script from run #$N's artifact"

      - name: Make the Short
        env:
          TOPIC_REQUEST: ${{ inputs.topic }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          ARGS=()
          N="$(echo "$REUSE_RUN" | tr -d ' #')"
          if [ -n "$N" ]; then
            ARGS+=(--reuse-run "$N")
          elif [ -n "$TOPIC_REQUEST" ]; then
            ARGS+=(--topic "$TOPIC_REQUEST")
          fi
          python -m fya "${ARGS[@]}"

      - name: Keep the video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save posting history
        run: |
          git config user.name "fya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/scripts
          git diff --cached --quiet || git commit -m "Log Short from run ${{ github.run_number }}"
          git pull --rebase -q origin "${{ github.ref_name }}"
          git push
